apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'
apply plugin: 'signing'

dependencies {
    implementation project(':play-services-cast')
    implementation project(':play-services-base-core')

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutineVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutineVersion"

    // The Cast v2 protocol is implemented in this module, see org.microg.gms.cast.protocol.
    // No third party Cast library is needed any more.

    // Unit tests run on the JVM and need a real org.json implementation, the mockable android.jar
    // only contains stubs.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

android {
    namespace "org.microg.gms.cast.core"

    compileSdkVersion androidCompileSdk
    buildToolsVersion "$androidBuildVersionTools"

    defaultConfig {
        versionName version
        minSdkVersion androidMinSdk
        targetSdkVersion androidTargetSdk
    }

    buildFeatures {
        dataBinding = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'MissingTranslation'
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    kotlinOptions {
        jvmTarget = 1.8
    }

    testOptions {
        unitTests {
            // The protocol implementation is tested against a fake Cast device, no Android
            // framework implementation is needed. android.util.Log calls are stubbed out.
            returnDefaultValues = true
        }
    }
}

apply from: '../../gradle/publish-android.gradle'

description = 'microG service implementation for play-services-cast'
